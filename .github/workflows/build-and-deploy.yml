name: Build and Deploy

# Netlify builds and deploys the site itself (see netlify.toml). This workflow
# verifies every push/PR builds cleanly, pings IndexNow for main, and can
# optionally deploy from Actions when the repository variable
# DEPLOY_WITH_ACTIONS is 'true' (requires valid NETLIFY_* secrets).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Submit ALL URLs (not just core pages) to IndexNow'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 15 1 *'  # Yearly refresh, January 15 at 06:00 UTC

concurrency:
  group: build-deploy
  cancel-in-progress: false

# Site settings come from repository Variables (Settings → Secrets and variables →
# Actions → Variables). Anything left unset falls back to src/config/site.ts.
env:
  SITE_URL: ${{ vars.SITE_URL }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
  ADSENSE_SLOT_TOP: ${{ vars.ADSENSE_SLOT_TOP }}
  ADSENSE_SLOT_IN_CONTENT: ${{ vars.ADSENSE_SLOT_IN_CONTENT }}
  ADSENSE_SLOT_SIDEBAR: ${{ vars.ADSENSE_SLOT_SIDEBAR }}
  GA4_ID: ${{ vars.GA4_ID }}
  CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
  PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
  YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
  PINTEREST_VERIFICATION: ${{ vars.PINTEREST_VERIFICATION }}
  INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
  AFF_HOTELS_URL: ${{ vars.AFF_HOTELS_URL }}
  AFF_MOVERS_URL: ${{ vars.AFF_MOVERS_URL }}
  AFF_INTERNET_URL: ${{ vars.AFF_INTERNET_URL }}
  AFF_INSURANCE_URL: ${{ vars.AFF_INSURANCE_URL }}
  AFF_SECURITY_URL: ${{ vars.AFF_SECURITY_URL }}
  AMAZON_TAG: ${{ vars.AMAZON_TAG }}
  TWITTER_HANDLE: ${{ vars.TWITTER_HANDLE }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ── Data pipeline ─────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run data pipeline
        run: python3 scripts/build_data.py

      - name: Verify data files
        run: |
          ZIP_COUNT=$(ls data/zips/*.json | wc -l)
          echo "Generated $ZIP_COUNT ZIP JSON files"
          [ "$ZIP_COUNT" -ge 35000 ] || { echo "ERROR: expected 35000+ ZIP files"; exit 1; }

      # ── Site build ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npx astro build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify build output
        run: |
          PAGE_COUNT=$(find dist -name "*.html" | wc -l)
          echo "Built $PAGE_COUNT HTML pages"
          [ "$PAGE_COUNT" -ge 70000 ] || { echo "ERROR: expected 70000+ pages"; exit 1; }
          test -f dist/zip/90210/index.html
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          test -f dist/zip-index.json

      # ── Deploy ────────────────────────────────────────────────
      - name: Deploy to Netlify
        if: github.event_name != 'pull_request' && vars.DEPLOY_WITH_ACTIONS == 'true'
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --message "Deploy from GitHub Actions (commit ${GITHUB_SHA::7})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify search engines (IndexNow)
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 scripts/indexnow.py ${{ (github.event_name == 'workflow_dispatch' && inputs.indexnow_all) && '--all' || '' }}
