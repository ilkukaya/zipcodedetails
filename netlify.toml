[build]
  # Netlify builds the whole site: data pipeline (from data/pseo_zipcodes_full.json.gz)
  # then Astro. Python packages from requirements.txt are installed automatically.
  command = "python3 scripts/build_data.py && npx astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.11"
  NODE_OPTIONS = "--max-old-space-size=6144"

# ── Security & performance headers ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"

# Hashed build assets never change
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/zip-index.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# ── Redirects for common URL variations ────────────────────────
[[redirects]]
  from = "/zipcode/*"
  to = "/zip/:splat"
  status = 301

[[redirects]]
  from = "/zip-code/*"
  to = "/zip/:splat"
  status = 301

[[redirects]]
  from = "/postal-code/*"
  to = "/zip/:splat"
  status = 301

[[redirects]]
  from = "/states/:state"
  to = "/state/:state/"
  status = 301

[[redirects]]
  from = "/cities/*"
  to = "/city/:splat"
  status = 301

[[redirects]]
  from = "/tools/zip-code-distance-calculator/"
  to = "/tools/zip-code-distance/"
  status = 301

[[redirects]]
  from = "/my-zip-code/"
  to = "/what-is-my-zip-code/"
  status = 301
